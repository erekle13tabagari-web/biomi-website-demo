<?xml version="1.0" encoding="UTF-8"?>
<!-- Tab icon. A filled tile rather than the bare logomark, because the mark is
     a thin outline: at 16px antialiasing blends that stroke into the tab bar
     and washes its colour out to grey whatever colour it is set to. A solid
     field keeps its colour at any size and reads on light and dark chrome
     alike. Background is Super Blue (#0249f7, the site's gold token); the mark
     is knocked out in white. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="13" fill="#0249f7"/>
  <g transform="translate(16.3 12) scale(0.5338)">
    <path fill="#fff" d="M59.07,47.92c-1.23,14.49-12.69,25.83-27.19,26.93-6.27.48-12.18-1.02-17.16-3.93-2.77-1.61-5.25-3.66-7.35-6.06C2.96,59.87.22,53.37,0,46.26V0h7.36s-.04,38.44,0,46.11c.03,6.25,3.01,11.84,7.35,15.76,4.32,3.89,10.17,6.12,16.52,5.66,10.83-.79,19.58-9.4,20.51-20.22,1.13-13.14-9.25-24.19-22.16-24.19-2.64,0-5.16.46-7.51,1.3v19.09h-7.35V0h7.35v16.72c2.4-.64,4.91-.97,7.51-.97,17.17,0,30.97,14.7,29.49,32.16"/>
